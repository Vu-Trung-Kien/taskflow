name: taskflow

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?Thiếu POSTGRES_USER trong .env}:${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong .env}@postgres:5432/${POSTGRES_DB:?Thiếu POSTGRES_DB trong .env}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Thiếu JWT_ACCESS_SECRET trong .env}
      PORT: 3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # giao diện web

  # S3 giả lập dùng riêng cho môi trường local.
  seaweedfs:
    image: chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d # ghim bản đã kéo ngày 2026-10-15
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Thiếu S3_ACCESS_KEY trong .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Thiếu S3_SECRET_KEY trong .env}
      S3_BUCKET: ${S3_BUCKET:?Thiếu S3_BUCKET trong .env}
    ports:
      - "127.0.0.1:8333:8333" # S3 endpoint
    volumes:
      - seaweed-data:/data

volumes:
  pgdata:
  seaweed-data:
