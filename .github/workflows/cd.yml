name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full 40-character image SHA to deploy (use a previous SHA for application rollback)
        required: true
        type: string

permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY_NAME: taskflow-api

concurrency:
  group: taskflow-production
  cancel-in-progress: false

jobs:
  release:
    name: release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Select image SHA
        id: release
        env:
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            image_tag="$DISPATCH_SHA"
          else
            image_tag="$WORKFLOW_SHA"
          fi
          if [[ ! "$image_tag" =~ ^[0-9a-f]{40}$ ]]; then
            echo "A full lowercase 40-character commit SHA is required." >&2
            exit 1
          fi
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set build metadata
        if: github.event_name == 'workflow_run'
        id: metadata
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build API and migrator images
        if: github.event_name == 'workflow_run'
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          BUILD_TIME: ${{ steps.metadata.outputs.build_time }}
        run: |
          set -euo pipefail
          docker build \
            --target runtime \
            --build-arg GIT_SHA="$IMAGE_TAG" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            --tag "taskflow-api:$IMAGE_TAG" \
            ./backend
          docker build \
            --target migrator \
            --build-arg GIT_SHA="$IMAGE_TAG" \
            --build-arg BUILD_TIME="$BUILD_TIME" \
            --tag "taskflow-migrator:$IMAGE_TAG" \
            ./backend

      - name: Scan API image with Trivy
        if: github.event_name == 'workflow_run'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-api:${{ steps.release.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Scan migrator image with Trivy
        if: github.event_name == 'workflow_run'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: taskflow-migrator:${{ steps.release.outputs.image_tag }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: taskflow-cd-${{ steps.release.outputs.image_tag }}

      - name: Resolve ECR repository and verify image tags
        id: images
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
        run: |
          set -euo pipefail
          repository_uri="$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --query 'repositories[0].repositoryUri' \
            --output text)"
          image_details="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY_NAME" \
            --output json)"
          api_tag_count="$(jq --arg tag "$IMAGE_TAG" \
            '[.imageDetails[]? | select((.imageTags // []) | index($tag))] | length' \
            <<<"$image_details")"
          migrator_tag_count="$(jq --arg tag "${IMAGE_TAG}-migrator" \
            '[.imageDetails[]? | select((.imageTags // []) | index($tag))] | length' \
            <<<"$image_details")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$api_tag_count" != "1" || "$migrator_tag_count" != "1" ]]; then
              echo "Both immutable API and migrator images must already exist in ECR for a manual deploy/rollback." >&2
              exit 1
            fi
          elif [[ "$api_tag_count" == "1" && "$migrator_tag_count" == "1" ]]; then
            echo "Images already exist; reusing the immutable release for this retry."
          elif [[ "$api_tag_count" != "0" || "$migrator_tag_count" != "0" ]]; then
            echo "A partial immutable release exists; the existing tag will be reused and only the missing image will be pushed."
          fi
          echo "repository_uri=$repository_uri" >> "$GITHUB_OUTPUT"
          echo "api_exists=$api_tag_count" >> "$GITHUB_OUTPUT"
          echo "migrator_exists=$migrator_tag_count" >> "$GITHUB_OUTPUT"

      - name: Push immutable images to ECR
        if: >-
          github.event_name == 'workflow_run' &&
          (steps.images.outputs.api_exists == '0' || steps.images.outputs.migrator_exists == '0')
        env:
          ECR_REPOSITORY_URI: ${{ steps.images.outputs.repository_uri }}
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          API_EXISTS: ${{ steps.images.outputs.api_exists }}
          MIGRATOR_EXISTS: ${{ steps.images.outputs.migrator_exists }}
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "${ECR_REPOSITORY_URI%%/*}"
          if [[ "$API_EXISTS" == "0" ]]; then
              docker tag "taskflow-api:$IMAGE_TAG" "$ECR_REPOSITORY_URI:$IMAGE_TAG"
              docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
            fi
            if [[ "$MIGRATOR_EXISTS" == "0" ]]; then
              docker tag "taskflow-migrator:$IMAGE_TAG" "$ECR_REPOSITORY_URI:$IMAGE_TAG-migrator"
              docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG-migrator"
            fi

      - name: Package production deployment files
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/taskflow-deploy.tar.gz" \
            deploy/compose.production.yaml \
            deploy/deploy-release.sh

      - name: Deploy through Systems Manager
        env:
          IMAGE_TAG: ${{ steps.release.outputs.image_tag }}
          ECR_REPOSITORY_URI: ${{ steps.images.outputs.repository_uri }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [[ ! "$INSTANCE_ID" =~ ^i-[0-9a-f]+$ ]]; then
            echo "Set the EC2_INSTANCE_ID repository variable to the production instance ID." >&2
            exit 1
          fi
          package_b64="$(base64 --wrap=0 "$RUNNER_TEMP/taskflow-deploy.tar.gz")"
          command="set -euo pipefail; install -d -m 0750 /opt/taskflow/releases/${IMAGE_TAG}; printf '%s' '${package_b64}' | base64 --decode | tar -xz -C /opt/taskflow/releases/${IMAGE_TAG}; bash /opt/taskflow/releases/${IMAGE_TAG}/deploy-release.sh '${IMAGE_TAG}' '${ECR_REPOSITORY_URI}' '${AWS_REGION}'"
          parameters="$(jq --null-input --compact-output --arg command "$command" '{commands: [$command]}')"
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "TaskFlow release ${IMAGE_TAG}" \
            --timeout-seconds 1800 \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "SSM command submitted: $command_id"

          for attempt in $(seq 1 180); do
            status="$(aws ssm list-command-invocations \
              --command-id "$command_id" \
              --details \
              --query 'CommandInvocations[0].Status' \
              --output text)"
            case "$status" in
              Success)
                echo "Deployment command completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$INSTANCE_ID" \
                  --query '{Status:Status,StatusDetails:StatusDetails}' \
                  --output json
                exit 1
                ;;
              Pending|InProgress|Delayed|None|"")
                sleep 10
                ;;
              *)
                echo "Unexpected SSM command status: $status" >&2
                exit 1
                ;;
            esac
          done
          echo "Timed out waiting for SSM command $command_id; inspect it in Systems Manager." >&2
          exit 1
